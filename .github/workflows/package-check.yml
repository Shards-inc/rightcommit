name: Check installable package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev cmake pkg-config libssl-dev
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install protobuf cmake pkgconf openssl@3
      - name: Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup override set 1.95.0
      - name: Check bundled resources
        run: python3 scripts/bundle-assets.py --check
      - name: Test
        run: cargo test --locked
      - name: Assemble crate and install from its contents
        shell: bash
        run: |
          cargo package --locked --no-verify
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tar -xzf "target/package/rightcommit-$version.crate" -C target/package
          cargo install --path "target/package/rightcommit-$version" --debug --locked --root "$RUNNER_TEMP/installed" --target-dir "$PWD/target"
          rm -r "target/package/rightcommit-$version"
          python3 scripts/check-installed.py "$RUNNER_TEMP/installed/bin/rightcommit"
