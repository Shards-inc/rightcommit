name: rightcommit

services:
  rightcommit:
    container_name: rightcommit
    build: .
    image: rightcommit:local
    ports:
      - "127.0.0.1:${RIGHTCOMMIT_PORT:-8080}:8080"
    volumes:
      - rightcommit-data:/data
      - ./sources:/sources
    environment:
      # App options read from .env; defaults preserve local HTTP and closed signup.
      NODO_ALLOW_REGISTRATION: ${NODO_ALLOW_REGISTRATION:-0}
      NODO_SECURE_COOKIE: ${NODO_SECURE_COOKIE:-0}
      NODO_CONNECTOR_HOSTS: ${NODO_CONNECTOR_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-rightcommit=info}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      ANTHROPIC_FEDERATION_RULE_ID: ${ANTHROPIC_FEDERATION_RULE_ID:-}
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${ANTHROPIC_IDENTITY_TOKEN_FILE:-}
      ANTHROPIC_ORGANIZATION_ID: ${ANTHROPIC_ORGANIZATION_ID:-}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${ANTHROPIC_SERVICE_ACCOUNT_ID:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANT_LING_API_KEY: ${ANT_LING_API_KEY:-}
      AWS_CONTAINER_AUTHORIZATION_TOKEN: ${AWS_CONTAINER_AUTHORIZATION_TOKEN:-}
      AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE: ${AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE:-}
      AWS_CONTAINER_CREDENTIALS_FULL_URI: ${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}
      AWS_CONTAINER_CREDENTIALS_RELATIVE_URI: ${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${AZURE_OPENAI_DEPLOYMENT_NAME_MAP:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_GATEWAY_ID: ${CLOUDFLARE_GATEWAY_ID:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_CN_API_KEY: ${MINIMAX_CN_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      PI_LOCAL_BASE_URL: ${PI_LOCAL_BASE_URL:-}
      QWEN_TOKEN_PLAN_API_KEY: ${QWEN_TOKEN_PLAN_API_KEY:-}
      QWEN_TOKEN_PLAN_CN_API_KEY: ${QWEN_TOKEN_PLAN_CN_API_KEY:-}
      RADIUS_API_KEY: ${RADIUS_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      # TypeSafe classifier models.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_TOKEN_PLAN_AMS_API_KEY: ${XIAOMI_TOKEN_PLAN_AMS_API_KEY:-}
      XIAOMI_TOKEN_PLAN_CN_API_KEY: ${XIAOMI_TOKEN_PLAN_CN_API_KEY:-}
      XIAOMI_TOKEN_PLAN_SGP_API_KEY: ${XIAOMI_TOKEN_PLAN_SGP_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_CODING_CN_API_KEY: ${ZAI_CODING_CN_API_KEY:-}
      # Optional operator environment. Provider modes keep incompatible credentials separate.
      PI_LOCAL_API_KEY: ${PI_LOCAL_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: ${CLAUDE_AUTOCOMPACT_PCT_OVERRIDE:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_CUSTOM_HEADERS: ${ANTHROPIC_CUSTOM_HEADERS:-}
      ANTHROPIC_BETAS: ${ANTHROPIC_BETAS:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL_NAME: ${ANTHROPIC_DEFAULT_OPUS_MODEL_NAME:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL_NAME: ${ANTHROPIC_DEFAULT_SONNET_MODEL_NAME:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME: ${ANTHROPIC_DEFAULT_HAIKU_MODEL_NAME:-}
      CLAUDE_CODE_USE_BEDROCK: ${CLAUDE_CODE_USE_BEDROCK:-}
      CLAUDE_CODE_USE_MANTLE: ${CLAUDE_CODE_USE_MANTLE:-}
      CLAUDE_CODE_USE_ANTHROPIC_AWS: ${CLAUDE_CODE_USE_ANTHROPIC_AWS:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_CONFIG_FILE: ${AWS_CONFIG_FILE:-}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_ROLE_SESSION_NAME: ${AWS_ROLE_SESSION_NAME:-}
      ANTHROPIC_BEDROCK_BASE_URL: ${ANTHROPIC_BEDROCK_BASE_URL:-}
      ANTHROPIC_BEDROCK_MANTLE_BASE_URL: ${ANTHROPIC_BEDROCK_MANTLE_BASE_URL:-}
      ANTHROPIC_BEDROCK_REGION_PREFIX: ${ANTHROPIC_BEDROCK_REGION_PREFIX:-}
      CLAUDE_CODE_SKIP_BEDROCK_AUTH: ${CLAUDE_CODE_SKIP_BEDROCK_AUTH:-}
      ANTHROPIC_AWS_API_KEY: ${ANTHROPIC_AWS_API_KEY:-}
      ANTHROPIC_AWS_BASE_URL: ${ANTHROPIC_AWS_BASE_URL:-}
      ANTHROPIC_AWS_WORKSPACE_ID: ${ANTHROPIC_AWS_WORKSPACE_ID:-}
      CLAUDE_CODE_USE_VERTEX: ${CLAUDE_CODE_USE_VERTEX:-}
      CLAUDE_CODE_SKIP_VERTEX_AUTH: ${CLAUDE_CODE_SKIP_VERTEX_AUTH:-}
      ANTHROPIC_VERTEX_PROJECT_ID: ${ANTHROPIC_VERTEX_PROJECT_ID:-}
      ANTHROPIC_VERTEX_BASE_URL: ${ANTHROPIC_VERTEX_BASE_URL:-}
      CLOUD_ML_REGION: ${CLOUD_ML_REGION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GCLOUD_PROJECT: ${GCLOUD_PROJECT:-}
      GOOGLE_OAUTH_ACCESS_TOKEN: ${GOOGLE_OAUTH_ACCESS_TOKEN:-}
      CLAUDE_CODE_USE_FOUNDRY: ${CLAUDE_CODE_USE_FOUNDRY:-}
      CLAUDE_CODE_SKIP_FOUNDRY_AUTH: ${CLAUDE_CODE_SKIP_FOUNDRY_AUTH:-}
      ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY:-}
      ANTHROPIC_FOUNDRY_AUTH_TOKEN: ${ANTHROPIC_FOUNDRY_AUTH_TOKEN:-}
      ANTHROPIC_FOUNDRY_RESOURCE: ${ANTHROPIC_FOUNDRY_RESOURCE:-}
      ANTHROPIC_FOUNDRY_BASE_URL: ${ANTHROPIC_FOUNDRY_BASE_URL:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_CLIENT_CERTIFICATE_PATH: ${AZURE_CLIENT_CERTIFICATE_PATH:-}
      AZURE_FEDERATED_TOKEN_FILE: ${AZURE_FEDERATED_TOKEN_FILE:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Use the image's CA store when no custom certificate paths are configured.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      SSL_CERT_DIR: ${SSL_CERT_DIR:-/etc/ssl/certs}
      CODEX_CA_CERTIFICATE: ${CODEX_CA_CERTIFICATE:-}
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    pids_limit: 256
    mem_limit: 4g
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  rightcommit-data:
    name: rightcommit-data
