# cargo-deny configuration. Run `cargo deny check` before every push.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail the check only when rightcommit depends on them directly.
# Today backoff, instant, number_prefix, paste and unsafe-libyaml arrive through
# swiftide, fastembed and lancedb.
unmaintained = "workspace"
ignore = [
    # zstd 0.13.3 and zstd-safe 7.3.0 come from arrow-ipc 58, required by lancedb 0.41.0
    # (the latest release). The fixes need zstd 0.14 / zstd-safe 8.2, which only arrow 60
    # uses. The RAG index only decompresses data that rightcommit wrote itself.
    # Remove these entries when lancedb moves to arrow 60.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via lancedb/arrow 58; no compatible fix yet" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 via lancedb/arrow 58; no compatible fix yet" },
    { id = "RUSTSEC-2026-0403", reason = "zstd 0.13 via lancedb/arrow 58; no compatible fix yet" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # rightcommit's own license.
    { crate = "rightcommit", allow = ["FSL-1.1-ALv2"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
